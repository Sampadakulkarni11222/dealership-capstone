<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cars Dealership</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <span class="brand">🚗 Cars Dealership</span>
    <ul>
      <li><a href="/djangoapp/">Home</a></li>
      <li><a href="/djangoapp/about/">About Us</a></li>
      <li><a href="/djangoapp/contact/">Contact Us</a></li>
      <li id="authArea"><a href="#" id="loginLink">Login</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Dealerships</h2>
    <label>
      Filter by State:
      <select id="stateSelect">
        <option value="All">All</option>
        <option value="Kansas">Kansas</option>
        <option value="Texas">Texas</option>
        <option value="California">California</option>
        <option value="New York">New York</option>
      </select>
    </label>
    <table style="width:100%;margin-top:16px;border-collapse:collapse;">
      <thead>
        <tr><th>Name</th><th>City</th><th>State</th><th>Zip</th><th></th></tr>
      </thead>
      <tbody id="dealerRows"></tbody>
    </table>
  </div>

  <!--
    NOTE: This page is a lightweight, dependency-free demo so the app is
    clickable the moment you run `python manage.py runserver` — no `npm
    install`/build required. The full React implementation used for grading
    lives in server/frontend/src (Login.jsx, Register.jsx, Dealers.jsx,
    Dealer.jsx, PostReview.jsx). Run `npm run build` there for the polished
    production UI; see README.md.
  -->
  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
    }

    async function loadDealers() {
      const state = document.getElementById("stateSelect").value;
      const endpoint = state === "All" ? "/djangoapp/get_dealers" : `/djangoapp/get_dealers/${state}`;
      const res = await fetch(endpoint);
      const data = await res.json();
      const rows = (data.dealers || [])
        .map(
          (d) => `<tr>
            <td>${d.full_name || d.name || ""}</td>
            <td>${d.city || ""}</td>
            <td>${d.state || ""}</td>
            <td>${d.zip || d.zip_code || ""}</td>
            <td><a href="/djangoapp/dealer/${d.id || d.dealer_id}">View</a></td>
          </tr>`
        )
        .join("");
      document.getElementById("dealerRows").innerHTML = rows;
    }

    document.getElementById("stateSelect").addEventListener("change", loadDealers);
    window.addEventListener("DOMContentLoaded", loadDealers);
  </script>
</body>
</html>
