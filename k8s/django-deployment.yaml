apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  labels:
    app: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      containers:
        - name: django-app
          image: <YOUR_REGISTRY>/dealership-django:latest
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_URL
              value: "http://database-service:3030"
            - name: SENTIMENT_ANALYZER_URL
              value: "http://sentiment-analyzer-service:5050"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_DEBUG
              value: "False"
---
apiVersion: v1
kind: Service
metadata:
  name: django-app-service
spec:
  selector:
    app: django-app
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
